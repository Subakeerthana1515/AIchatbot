{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-store" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login - AvoraQ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
<link rel="stylesheet" href="{% static 'style.css' %}" />
<style>
  /* Background & Layout */
  body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem;
    overflow-y: auto;
    position: relative;
  }
  .bg-animation {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url("https://www.transparenttextures.com/patterns/cubes.png");
    opacity: 0.07;
    animation: floatBackground 30s linear infinite;
    z-index: 0;
  }
  @keyframes floatBackground {
    from { background-position: 0 0; }
    to { background-position: 1000px 1000px; }
  }

  /* Glassmorphic Card */
  .login-card {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    padding: 2.5rem 3rem 3rem;
    color: #fff;
    animation: fadeInUp 0.8s ease forwards;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Branding */
  .brand {
    text-align: center;
    margin-bottom: 2rem;
  }
  .brand h1 {
    font-size: 2.25rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: #fff;
    margin-bottom: 0.25rem;
    text-shadow: 0 0 10px rgba(118, 75, 162, 0.7);
  }
  .brand small {
    font-size: 1rem;
    opacity: 0.8;
    letter-spacing: 0.05em;
  }

  /* Form Title */
  .login-card h2 {
    text-align: center;
    margin-bottom: 2rem;
    font-weight: 600;
    font-size: 1.5rem;
  }

  /* Inputs */
  .form-control {
    background: rgba(255, 255, 255, 0.18);
    border: none;
    color: #fff;
    font-size: 1rem;
    border-radius: 12px;
    padding: 0.9rem 1.25rem;
    box-shadow: inset 0 0 8px rgba(255,255,255,0.1);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .form-control::placeholder {
    color: #ddd;
    opacity: 0.8;
  }
  .form-control:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.35);
    box-shadow: 0 0 16px rgba(118, 75, 162, 0.8);
    color: #000;
  }
  label {
    font-weight: 500;
    margin-bottom: 0.3rem;
    display: block;
    color: #ddd;
  }

  /* Password toggle */
  .password-field {
    position: relative;
    display: block;
    align-items: center;
  }
  .toggle-password {
    position: absolute;
    right: 18px;
    top: 70%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #ddd;
    font-size: 1.25rem;
    transition: color 0.3s ease;
    user-select: none;
    z-index: 10;
  }
  .toggle-password:hover {
    color: #fff;
  }

  /* Buttons */
  .btn-login {
    display: block;
    width: 100%;
    padding: 0.75rem;
    font-weight: 700;
    font-size: 1.1rem;
    background: #ffffff;
    color: #764ba2;
    border: none;
    border-radius: 14px;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
    cursor: pointer;
    margin-top: 1rem;
    user-select: none;
  }
  .btn-login:hover {
    background: #f9f9f9;
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
    transform: translateY(-3px) scale(1.03);
  }

  /* Messages */
  .alert {
    background: rgba(255, 50, 50, 0.15);
    border: none;
    color: #ffb3b3;
    box-shadow: 0 0 15px rgba(255, 50, 50, 0.3);
  }

  /* Footer Links */
  .footer-links {
    margin-top: 1.5rem;
    text-align: center;
    font-size: 0.9rem;
    color: #ddd;
  }
  .footer-links a {
    color: #fff;
    text-decoration: underline;
    margin: 0 0.4rem;
    transition: color 0.3s ease;
  }
  .footer-links a:hover {
    color: #ffefff;
  }

  /* Footer */
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 1rem 0;
    text-align: center;
    font-size: 0.9rem;
    color: #ddd;
    background: rgba(0, 0, 0, 0.25);
    user-select: none;
  }
  .logo-background {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  opacity: 0.5;           /* Slightly lower for subtle effect */
  filter: blur(4px);
  max-width: 400px;
  height: 300px;          /* fixed height */
  width: auto;            /* keep aspect ratio */
  z-index: 0;             /* behind the login card */
  user-select: none;
  pointer-events: none;
}


  /* Responsive */
  @media (max-width: 480px) {
    .login-card {
      padding: 2rem 1.5rem 2.5rem;
      max-width: 100%;
      border-radius: 16px;
    }
  }
</style>
</head>
<body>
  <div class="bg-animation"></div>
 <img src="{% static 'images/techjays_logo.png' %}" alt="TechJays Logo" class="logo-background" />

  <div class="login-card">
    
    <div class="brand">
      <h1>AvoraQ</h1>
      <small>AI-powered Document Assistant</small>
    </div>

    <h2>Login</h2>

    {% if messages %}
      <div class="alert alert-danger" role="alert">
        {% for message in messages %}
          <p class="mb-0">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" class="form-control" placeholder="Enter username" required />
      </div>

      <div class="mb-4 password-field">
        <label for="password" class="w-100">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required />
        <i class="bi bi-eye-slash toggle-password" id="togglePassword" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility" role="button"></i>
      </div>

      <button type="submit" class="btn-login">Login</button>
    </form>

    <div class="footer-links mt-3">
      <p>
        Don't have an account? <a href="{% url 'techjays:register' %}">Register here</a>
      </p>
      <p>
        <a href="{% url 'techjays:forget_password' %}">Forgot your password?</a>
      </p>
    </div>
  </div>

  <footer>© 2025 AvoraQ, Inc</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('togglePassword');
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      toggleIcon.classList.toggle("bi-eye");
      toggleIcon.classList.toggle("bi-eye-slash");
    }
  </script>
</body>
</html>
